[project]
name = "hoa-cli"
version = "1.0.0"
description = "从哈尔滨工业大学本部教务系统抓取各年级、各专业的本科执行教学计划课程数据"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "HITSZ-OpenAuto" }]
keywords = ["hit", "education", "courses", "curriculum", "teaching-plan"]
dependencies = [
    "beautifulsoup4>=4.13.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "toml>=0.10.2",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
hoa = "hoa_cli.app:entrypoint"

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.4.0",
    "responses>=0.25.0",
    "ruff>=0.14.13",
]
