# 教务系统专业信息存在歧义时，由维护者确认后记录在这里。
#
# 完整样例：新增规则时去掉每一行前面的 #。
# [[rules]] # 一条专业规则的开始。
# year = 2024 # 必填：可写一个年级，也可写成 [2024, 2025]。
# code = "12345" # 教务系统返回的专业代码。
# publish = true # 是否发布；不填写时默认 true，填 false 表示跳过。
# name = "专业名称（补充方向）" # 可选：替换来源中不完整的专业名称。
# reason = "教务系统遗漏专业方向，已由维护者确认。" # 必填：记录修正依据。

